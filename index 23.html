 if(a.type==='jour'){const T=jtext(),all=Object.keys(s.jn).length===6;return '<div class="card"><div class="meta"><span>'+a.n+' · '+a.min+' min</span><span>Choose your answers</span></div><div class="learn">Imagine you are going on a journey! Answer each question, then say how you feel.</div>'+JQ.map((q,i)=>'<div><div class="q" style="font-size:clamp(19px,2.6vw,24px)">'+q[0]+'</div><div class="grid" style="margin-top:6px">'+q[1].map((x,k)=>'<button class="o'+(s.jn[i]===k?' pk':'')+'" onclick="jn('+i+','+k+')"><span>'+x+'</span></button>').join('')+'</div></div>').join('')+(all?'<div class="q" style="font-size:clamp(19px,2.6vw,24px)">How do you feel about your journey?</div><div class="grid"><button class="o'+(s.ft===0?' pk':'')+'" onclick="jf(0)">'+fc('e',40)+'<span>I can’t wait!</span></button><button class="o'+(s.ft===1?' pk':'')+'" onclick="jf(1)">'+fc('w',40)+'<span>I’m a little worried.</span></button></div>':'')+(T.length?'<div class="box"><b>My journey dialogue</b><br>'+T.map(l=>'<b>'+l[0]+':</b> '+l[1]).join('<br>')+'</div><div class="row"><button class="go alt" onclick="jhear()">▶ Hear my dialogue</button></div>':'')+'</div>'}
 const g=i=>'<b>'+(s.ans[i]===undefined?'______':C.o[i][s.ans[i]])+'</b>',n=C.a.filter((x,i)=>s.ans[i]===x).length;
 return '<div class="card"><div class="meta"><span>Finishing the lesson · English in action</span><b>(5 marks)</b></div><div style="font-style:italic;font-size:18px">For each item, shade in the bubble next to the correct option.</div><div class="box">'+C.t.replace(/\{(\d)\}/g,(m,i)=>g(+i))+'</div>'+C.o.map((os,gi)=>'<div class="cz"><b>'+(gi+1)+')</b>'+os.map((w,i)=>{const sel=s.ans[gi]===i,cls=s.chk&&i===C.a[gi]?' ok':s.chk&&sel?' bad':'';return '<button class="o'+(sel?' sel':'')+cls+'" onclick="cl('+gi+','+i+')"><span class="dot"></span>'+w+'</button>'}).join('')+'</div>').join('')+(s.chk?'<div class="big-stamp">'+fc(n>=4?'e':n>=3?'h':'w',70)+n+' / 5</div>':'')+'<div class="row"><span style="margin-right:auto;font-size:20px;font-weight:700">'+(s.chk?(n===5?'Excellent! What an adventure!':'Review: '+C.a.map((x,i)=>s.ans[i]!==x?C.o[i][x]:null).filter(Boolean).join(', ')):'Answer all 5 items, then press Check.')+'</span><button class="go alt" onclick="chk()">Check</button><button class="go" onclick="retry()">Try again</button></div><div class="credit">Created by T.Badria Alfalahi</div></div>'}

 const L=A.length-1,t=stars();

render();
